spring.application.name=vmcontrol
server.port=8080
server.servlet.context-path=/api


spring.datasource.url=jdbc:postgresql://localhost:5432/vmcontrol_db


spring.datasource.username=postgres
spring.datasource.password=1234


spring.datasource.driver-class-name=org.postgresql.Driver


spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000


spring.jpa.hibernate.ddl-auto=update


spring.jpa.show-sql=true


spring.jpa.properties.hibernate.format_sql=true


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


spring.jpa.open-in-view=false


cors.allowed-origins=http://localhost:4200


jwt.secret=mySuperSecretKeyThatIsAtLeast32CharactersLongForJWT123!
jwt.expiration=86400000


logging.level.org.springframework.security=DEBUG
logging.level.com.example.vmcontrol=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE




springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.paths-to-match=/v1/**


springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.disable-swagger-default-url=true


springdoc.default-flat-param-object=false
springdoc.cache.disabled=false


springdoc.packages-to-scan=com.example.vmcontrol.controller


springdoc.csrf.enabled=false
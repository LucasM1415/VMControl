<!-- Gráficos -->
<div class="mt-8 grid gap-6 lg:grid-cols-2">
  <!-- Gráfico de Barras -->
  <div class="p-6 rounded-2xl bg-white border border-gray-100 shadow-sm">
    <h2 class="text-lg font-semibold text-gray-800 mb-4">Status das VMs</h2>
    <div class="relative h-72">
      <canvas
        baseChart
        type="bar"
        [data]="barChartData"
        [options]="barChartOptions"
      ></canvas>
    </div>
  </div>

  <!-- Gráfico de Pizza -->
  <div class="p-6 rounded-2xl bg-white border border-gray-100 shadow-sm">
    <h2 class="text-lg font-semibold text-gray-800 mb-4">Limite de VMs ({{ totalVms }}/{{ maxVms }})</h2>
    <div class="relative h-72">
      <canvas
        baseChart
        type="doughnut"
        [data]="pieChartData"
        [options]="pieChartOptions"
      ></canvas>
    </div>
  </div>
</div>

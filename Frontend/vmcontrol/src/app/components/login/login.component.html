<div class="flex h-screen">
  <!-- Left Side - Branding -->
  <div class="hidden md:flex flex-col items-center justify-center w-1/2 bg-gradient-to-b from-[#5B1ADB] to-[#310E75] p-12 text-white">
    <div class="flex items-center mb-8">
      <img src="/Logo.png" alt="VMControl Logo" width="64" height="64" class="mr-4">
      <h1 class="text-5xl font-bold">VMControl</h1>
    </div>
    <p class="text-xl text-center opacity-90">Suas máquinas virtuais na palma da sua mão</p>
    <p class="mt-4 text-center opacity-75">Gerenciamento poderoso de virtualização simplificado</p>
  </div>

  <!-- Right Side - Login Form -->
  <div class="w-full md:w-1/2 flex items-center justify-center p-8 bg-gray-100">
    <div class="w-full max-w-md">
      <!-- Mobile Header -->
      <div class="md:hidden flex justify-center mb-8">
        <div class="flex items-center">
          <img src="/logo.png" alt="VMControl Logo" width="40" height="40" class="mr-2">
          <h1 class="text-3xl font-bold text-[#5B1ADB]">VMControl</h1>
        </div>
      </div>

      <!-- Login Form -->
      <div *ngIf="showLoginForm" class="bg-white rounded-xl shadow-lg p-8 animate-fadeIn">
        <h2 class="text-2xl font-bold text-gray-800 mb-6" style="font-family: 'Poppins', sans-serif;">Bem-vindo de volta</h2>
        
        <form (ngSubmit)="onLoginSubmit()" class="space-y-4">
          <!-- Email Input -->
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400">
                  <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                  <path d="m22 7-10 5L2 7"></path>
                </svg>
              </div>
              <input 
                type="email" 
                id="email" 
                [(ngModel)]="loginForm.email"
                name="email"
                class="pl-10 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#5B1ADB] focus:border-[#5B1ADB] outline-none transition" 
                placeholder="seu@email.com" 
                required>
            </div>
          </div>
          
          <!-- Password Input -->
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <input 
                type="password" 
                id="password" 
                [(ngModel)]="loginForm.password"
                name="password"
                class="pl-10 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#5B1ADB] focus:border-[#5B1ADB] outline-none transition" 
                placeholder="••••••••" 
                required>
            </div>
          </div>
          
          
          <!-- Submit Button -->
          <button 
            type="submit" 
            class="w-full bg-[#5B1ADB] hover:bg-[#4A15B8] text-white font-medium py-2 px-4 rounded-lg transition duration-200">
            Entrar
          </button>
        </form>
        
        <!-- Switch to Register -->
        <div class="mt-6 text-center">
          <p class="text-sm text-gray-600">
            Não tem uma conta? 
            <a (click)="toggleForms()" class="text-[#5B1ADB] hover:text-[#4A15B8] font-medium cursor-pointer">Cadastre-se</a>
          </p>
        </div>
      </div>

      <!-- Register Form -->
      <div *ngIf="showRegisterForm" class="bg-white rounded-xl shadow-lg p-8 animate-fadeIn">
        <h2 class="text-2xl font-bold text-gray-800 mb-6" style="font-family: 'Poppins', sans-serif;">Criar uma conta</h2>
        
        <form (ngSubmit)="onRegisterSubmit()" class="space-y-4">
          <!-- Full Name Input -->
          <div>
            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </div>
              <input 
                type="text" 
                id="name" 
                [(ngModel)]="registerForm.name"
                name="name"
                class="pl-10 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#5B1ADB] focus:border-[#5B1ADB] outline-none transition" 
                placeholder="João Silva" 
                required>
            </div>
          </div>
          
          <!-- Email Input -->
          <div>
            <label for="reg-email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400">
                  <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                  <path d="m22 7-10 5L2 7"></path>
                </svg>
              </div>
              <input 
                type="email" 
                id="reg-email" 
                [(ngModel)]="registerForm.email"
                name="email"
                class="pl-10 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#5B1ADB] focus:border-[#5B1ADB] outline-none transition" 
                placeholder="seu@email.com" 
                required>
            </div>
          </div>
          
          <!-- Password Input -->
          <div>
            <label for="reg-password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <input 
                type="password" 
                id="reg-password" 
                [(ngModel)]="registerForm.password"
                name="password"
                class="pl-10 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#5B1ADB] focus:border-[#5B1ADB] outline-none transition" 
                placeholder="••••••••" 
                minlength="6"
                required>
            </div>
          </div>
          
          <!-- Confirm Password Input -->
          <div>
            <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">Confirmar Senha</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <input 
                type="password" 
                id="confirm-password" 
                [(ngModel)]="registerForm.confirmPassword"
                name="confirmPassword"
                class="pl-10 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#5B1ADB] focus:border-[#5B1ADB] outline-none transition" 
                placeholder="••••••••" 
                minlength="6"
                required>
            </div>
          </div>
          
          <!-- Terms Checkbox -->
          <div class="flex items-center">
            <input 
              id="terms" 
              type="checkbox" 
              [(ngModel)]="registerForm.terms"
              name="terms"
              class="h-4 w-4 text-[#5B1ADB] focus:ring-[#5B1ADB] border-gray-300 rounded cursor-pointer" 
              required>
            <label for="terms" class="ml-2 block text-sm text-gray-700 cursor-pointer">
              Concordo com os <a href="#" class="text-[#5B1ADB] hover:text-[#4A15B8]">Termos de Serviço</a>
            </label>
          </div>
          
          <!-- Submit Button -->
          <button 
            type="submit" 
            class="w-full bg-[#5B1ADB] hover:bg-[#4A15B8] text-white font-medium py-2 px-4 rounded-lg transition duration-200">
            Criar Conta
          </button>
        </form>
        
        <!-- Switch to Login -->
        <div class="mt-6 text-center">
          <p class="text-sm text-gray-600">
            Já tem uma conta? 
            <a (click)="toggleForms()" class="text-[#5B1ADB] hover:text-[#4A15B8] font-medium cursor-pointer">Entrar</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
